<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WISSIO – Deutscher Plattform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">WISSIO</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="/textos">Meus Textos</a>
                {% if session.get('usuario_id') %}
                    <a class="nav-link text-success fw-bold" href="/novo-texto">+ Inserir Texto</a>
                    <a class="nav-link" href="/flashcards">Meus Flashcards</a>
                {% endif %}
            </div>
            <div class="navbar-nav ms-auto">
                {% if session.get('usuario_id') %}
                    <span class="nav-link text-light me-3">Olá, <strong>{{ session.get('usuario_nome') }}</strong></span>
                    <a class="btn btn-outline-light btn-sm" href="/logout">Sair</a>
                {% else %}
                    <a class="nav-link" href="/login">Entrar</a>
                    <a class="nav-link" href="/cadastro">Cadastrar</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
