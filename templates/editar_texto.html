{% extends "base.html" %}

{% block content %}
<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-pencil-square me-2"></i>Editar Texto</h2>
        <a href="{{ url_for('biblioteca') }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST" action="{{ url_for('editar_texto', id=texto.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
                
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" 
                           value="{{ texto.titulo }}" required>
                </div>
                
                <div class="mb-3">
                    <label for="nivel_cefr" class="form-label">Nível CEFR</label>
                    <select class="form-select" id="nivel_cefr" name="nivel_cefr">
                        {% for nivel in niveis %}
                        <option value="{{ nivel.name }}" {% if texto.nivel.value == nivel.value %}selected{% endif %}>
                            {{ nivel.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label for="conteudo" class="form-label">Conteúdo (em alemão)</label>
                    <textarea class="form-control" id="conteudo" name="conteudo" rows="8" required>{{ texto.conteudo_original }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label for="categoria" class="form-label">Categoria (opcional)</label>
                    <input type="text" class="form-control" id="categoria" name="categoria" 
                           value="{{ texto.categoria }}">
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-wissio-primary">
                        <i class="bi bi-save me-2"></i>Salvar Alterações
                    </button>
                    <a href="{{ url_for('ver_texto', id=texto.id) }}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
