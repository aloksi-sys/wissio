{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h3 class="card-title text-center mb-4">Entrar no WISSIO</h3>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" required placeholder="seu@email.com" value="{{ request.form.email if request.form.email else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="senha" class="form-control" required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn btn-wissio-primary w-100 btn-lg">Entrar</button>
            </form>
            
            <div class="text-center mt-3">
                <small class="text-muted">Não tem conta? <a href="{{ url_for('cadastro') }}">Cadastrar</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
