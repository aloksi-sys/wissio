{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Configure seu Plano de Estudos</h2>
                <p class="text-muted">Defina metas realistas para manter a consistência</p>
            </div>

            <form method="POST" action="{{ url_for('onboarding_plano') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Tempo de dedicação diária (minutos)</label>
                    <div class="input-group">
                        <input type="number" name="meta_diaria_minutos" class="form-control form-control-lg text-center" 
                               value="5" min="1" max="120" required>
                        <span class="input-group-text">min/dia</span>
                    </div>
                    <div class="form-text">Recomendado: 5-15 minutos por dia</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Textos por semana</label>
                    <div class="input-group">
                        <input type="number" name="meta_semanal_textos" class="form-control form-control-lg text-center" 
                               value="3" min="1" max="20" required>
                        <span class="input-group-text">textos/semana</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Vocabulário inicial (flashcards)</label>
                    <div class="input-group">
                        <input type="number" name="meta_flashcards_iniciais" class="form-control form-control-lg text-center" 
                               value="20" min="5" max="100" required>
                        <span class="input-group-text">palavras</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Seu nível atual de alemão</label>
                    <select name="nivel_atual" class="form-select form-select-lg" required>
                        {% for nivel in niveis %}
                        <option value="{{ nivel.value }}" {% if usuario.nivel_atual and nivel.value == usuario.nivel_atual.value %}selected{% endif %}>
                            {{ nivel.value }} {% if nivel.value == 'A1' %}- Iniciante{% elif nivel.value == 'A2' %}- Básico{% elif nivel.value == 'B1' %}- Intermediário{% elif nivel.value == 'B2' %}- Avançado{% else %}- Proficiência{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Começar a Estudar! 🚀</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
