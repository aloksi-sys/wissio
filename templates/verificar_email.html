{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                     style="width: 80px; height: 80px; background: var(--wissio-gold); color: var(--wissio-black);">
                    <i class="bi bi-envelope-check" style="font-size: 2.2rem;"></i>
                </div>
                <h2 class="fw-bold">Email Verificado!</h2>
                <p class="text-muted">Seu e-mail <strong>{{ usuario.email }}</strong> já está confirmado.</p>
            </div>

            <div class="alert alert-success d-flex align-items-start">
                <i class="bi bi-check-circle-fill me-2 mt-1"></i>
                <div>
                    <strong>Pronto!</strong> Você tem acesso completo a todos os recursos do WISSIO.
                </div>
            </div>

            <div class="d-grid gap-2">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <a href="{{ url_for('home') }}" class="btn btn-wissio-primary">
                    <i class="bi bi-house-door me-2"></i>Voltar ao painel
                </a>
                <a href="{{ url_for('biblioteca') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-book me-2"></i>Ir para a Biblioteca
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
