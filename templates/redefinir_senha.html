{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4" style="background: var(--bs-card-bg); border: 1px solid var(--bs-border-color);">
            <h3 class="text-center mb-4"><i class="bi bi-shield-lock me-2"></i>Nova Senha</h3>
            <p class="text-muted text-center mb-4">Insira sua nova senha abaixo.</p>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="senha" class="form-label">Nova Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required placeholder="Mínimo 6 caracteres">
                </div>
                
                <div class="mb-3">
                    <label for="confirmar_senha" class="form-label">Confirmar Nova Senha</label>
                    <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required placeholder="Repita a senha">
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-wissio-primary"><i class="bi bi-check-circle me-2"></i>Redefinir Senha</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
