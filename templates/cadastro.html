{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <h3 class="card-title text-center mb-4">Criar Conta</h3>
            <p class="text-center text-muted mb-4">Comece sua jornada no alemão gratuitamente</p>
            
            <form method="POST" action="{{ url_for('cadastro') }}">
                <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="nome" class="form-control" required placeholder="Digite seu nome" value="{{ request.form.nome if request.form.nome else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" required placeholder="seu@email.com" value="{{ request.form.email if request.form.email else '' }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input type="password" name="senha" class="form-control" required placeholder="Mínimo 6 caracteres" minlength="6">
                    <div class="form-text">Mínimo 6 caracteres</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmar Senha</label>
                    <input type="password" name="confirmar_senha" class="form-control" required placeholder="Repita a senha" minlength="6">
                </div>
                <button type="submit" class="btn btn-wissio-success w-100 btn-lg">Criar Conta</button>
            </form>
            
            <div class="text-center mt-3">
                <small class="text-muted">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
