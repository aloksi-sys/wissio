{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm p-4" style="background: var(--bs-card-bg); border: 1px solid var(--bs-border-color);">
            <h3 class="text-center mb-4"><i class="bi bi-key me-2"></i>Recuperar Senha</h3>
            <p class="text-muted text-center mb-4">Insira seu e-mail cadastrado para receber o link de redefinição.</p>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="seu@email.com">
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-wissio-primary"><i class="bi bi-send me-2"></i>Enviar Link</button>
                    <a href="{{ url_for('login') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-2"></i>Voltar ao Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
