# Configuração de Deploy no Render - SQLite ONLY
# NENHUMA referência a Supabase ou PostgreSQL aqui
# O banco é totalmente local em wissio.db dentro do container

services:
  - type: web
    name: wissio
    runtime: docker
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: ./entrypoint.sh
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: chave_secreta_wissio_2026
      - key: SQLALCHEMY_DATABASE_URI
        value: sqlite:///wissio.db
    healthCheckPath: /
    autoDeploy: true