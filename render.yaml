services:
  - type: web
    name: wissio
    runtime: docker
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        value: chave_secreta_wissio_2026
      - key: SQLALCHEMY_DATABASE_URI
        value: sqlite:///wissio.db
    healthCheckPath: /
    autoDeploy: true