services:
  - type: web
    name: wissio
    runtime: docker
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip cache purge || true
    envVars:
      - key: FLASK_ENV
        value: production
      # SECRET_KEY deve ser definida como segredo no painel do Render (sync: false).
      # Nunca versionar chaves de produção no repositório.
      - key: SECRET_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      # NOTA: NÃO definir DATABASE_URL - Render injeta automaticamente com Supabase
      # O código limpa DATABASE_URL antes de inicializar o SQLAlchemy
    healthCheckPath: /
    autoDeploy: true
    plan: free
    region: oregon